# ============================================================
# Perfil "test" — Configuracion para pruebas de integracion
# Usa H2 en memoria (sin necesidad de Docker PostgreSQL ni Redis)
# GestoPago en modo simulacion (sin llamadas reales al proveedor)
# ============================================================

server.port=0

# Base de datos H2 en memoria (compatible con JPA/Hibernate)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway deshabilitado en tests (usa ddl-auto en su lugar)
spring.flyway.enabled=false

# Redis — usar configuracion real pero permitir fallo sin detener el contexto
# El TwoFactorOtpServiceImpl tiene fallback en ConcurrentHashMap en memoria
spring.data.redis.host=localhost
spring.data.redis.port=6379

# GestoPago — modo simulacion (no llama al proveedor real)
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17-TEST
gestopago.auth.password=test-password
gestopago.auth.unidad=083
gestopago.sendtx.modo-simulacion=true
gestopago.crypto.secret-key=HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=
gestopago.crypto.iv=p5ldmBPdd/9pjC0bDC/nSg==

# JWT
jwt.secret=clave-secreta-para-tests-de-integracion-spring-boot-2026
jwt.expiration-ms=3600000

# Cloud config deshabilitado en tests
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

