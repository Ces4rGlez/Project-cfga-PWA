spring.config.import=optional:configserver:
server.port=8081

# ============================================================
# GestoPago — Configuracion externa (NO hardcodear valores reales aqui)
# Definir las siguientes variables de entorno antes de arrancar:
#   GESTOPAGO_URL                → URL base del proveedor
#   GESTOPAGO_ID_DISTRIBUIDOR    → ID numerico del distribuidor
#   GESTOPAGO_CODIGO_DISPOSITIVO → Codigo del dispositivo TPV
#   GESTOPAGO_PASSWORD           → Contrasena de autenticacion
#   GESTOPAGO_AES_KEY            → Clave AES-256 en Base64 (proporcionada por PuntoRed)
#   GESTOPAGO_AES_IV             → IV AES-256 en Base64 (proporcionado por PuntoRed)
# En desarrollo local, definirlas en un archivo .env (excluido del repositorio via .gitignore)
# En produccion, configurarlas como variables de entorno del servidor/contenedor o gestor de secretos.
# ============================================================
gestopago.auth.url=${GESTOPAGO_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.unidad=${GESTOPAGO_UNIDAD:083}

# Modo simulacion: true = omite llamada real a GestoPago sendTx.do (util en desarrollo)
# En produccion establecer la variable de entorno: GESTOPAGO_SIMULACION=false
gestopago.sendtx.modo-simulacion=${GESTOPAGO_SIMULACION:true}

# Claves criptograficas AES-256-CBC (NUNCA dejar valores reales hardcodeados en produccion)
gestopago.crypto.secret-key=${GESTOPAGO_AES_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.crypto.iv=${GESTOPAGO_AES_IV:p5ldmBPdd/9pjC0bDC/nSg==}

# ============================================================
# Base de datos PostgreSQL
# Variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_gestopago}?stringtype=unspecified
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.task.scheduling.pool.size=1

# ============================================================
# JWT — Secreto de firma de tokens internos
# Variable: JWT_SECRET (minimo 32 caracteres en produccion)
# ============================================================
jwt.secret=${JWT_SECRET:d94eac0506430245edfd6338409962d64c4b706927b81aeacd7bdd80be7e6d0c}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=20000
